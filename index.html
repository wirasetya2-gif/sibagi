<!DOCTYPE html>
<html lang="id">
<head>

<title>SIBAGI RPS</title>
<style>
  :root {
    --bg: #F7F4EC; --card: #FFFFFF; --ink: #1C1A16; --muted: #6B6558; --line: #E6E0D2;
    --brand: #F5B400; --brand-ink: #1A1300; --brand-2: #6E4E00; --brand-dark: #8A6100; --brand-soft: #FFF3C4;
    --appbar: #141414;
    --blue: #1D4F7A; --blue-soft: #E3EDF7; --amber: #8A5300; --amber-soft: #FFF0D2;
    --red: #B3261E; --red-soft: #FCE7E5; --green: #1C7646; --green-soft: #E1F3E8; --gray-soft: #F1EEE6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .latihan { background: #B3261E; color: #fff; font-size: 13px; text-align: center; padding: 6px 10px; font-weight: 700; letter-spacing: .3px; }
  .appbar { position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, #232323, var(--appbar)); color: #fff; display: flex;
    border-bottom: 3px solid var(--brand); box-shadow: 0 2px 10px rgba(0,0,0,.25);
    align-items: center; justify-content: space-between; padding: 10px 14px; gap: 10px; }
  .merek { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo-header { height: 46px; width: auto; display: block; flex: none; }
  .appbar .sub { font-size: 11.5px; color: #E9C766; line-height: 1.25; max-width: 110px; }
  .logo-masuk { width: 100%; max-width: 290px; height: auto; display: block; margin: 2px auto 16px; }
  .appbar-r { display: flex; align-items: center; gap: 8px; }
  .chip-peran { background: rgba(255,210,31,.14); color: #FFD84D; border: 1px solid rgba(255,210,31,.4); border-radius: 999px;
    padding: 4px 11px; font-size: 13px; font-weight: 700; }
  .icon-btn { background: transparent; border: 1px solid rgba(255,210,31,.45); color: #FFD84D; border-radius: 10px;
    width: 38px; height: 36px; font-size: 18px; cursor: pointer; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 100px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .kanan { text-align: right; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 12px; }
  .head h2 { margin: 0; }
  .back { background: none; border: 0; color: var(--brand-dark); font-weight: 700; padding: 6px 0; cursor: pointer; font-size: 15px; }
  .hello .t { font-size: 22px; font-weight: 800; }
  .task { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .task:first-child { border-top: 0; padding-top: 4px; }
  .task[data-a] { cursor: pointer; }
  .task .ic { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; flex: none; }
  .task .tx { flex: 1; min-width: 0; }
  .task .t { font-weight: 700; }
  .task .d { font-size: 13px; color: var(--muted); }
  .chev { color: var(--muted); font-size: 22px; }
  .ic.gray { background: var(--gray-soft); color: var(--muted); }
  .ic.amber { background: var(--amber-soft); color: var(--amber); }
  .ic.blue { background: var(--blue-soft); color: var(--blue); }
  .ic.red { background: var(--red-soft); color: var(--red); }
  .ic.green { background: var(--green-soft); color: var(--green); }
  .ic.nol { background: var(--gray-soft); color: #9AA7A2; }
  .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi div { background: var(--gray-soft); border-radius: 12px; padding: 10px 12px; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi .v { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: right; font-size: 12px; color: var(--muted); font-weight: 700; padding: 4px 0 6px 8px; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
  .tbl td { text-align: right; padding: 6px 0 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tbl td:first-child { font-weight: 700; white-space: normal; }
  .btn { display: block; width: 100%; padding: 13px 14px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: #fff; color: var(--brand-2); border: 1.5px solid var(--brand); box-shadow: none; }
  .btn:active { filter: brightness(.94); }
  .btn.danger { background: #fff; color: var(--red); border: 1.5px solid var(--red); box-shadow: none; }
  .btn.wa { background: #1FA855; color: #fff; }
  .btn.sm { display: inline-block; width: auto; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .btn + .btn { margin-top: 10px; }
  .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dua .btn + .btn { margin-top: 0; }
  .link { background: none; border: 0; color: var(--brand-dark); font-weight: 700; padding: 0; cursor: pointer; font-size: 14px; text-decoration: none; }
  .link.merah { color: var(--red); }
  label.lb { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  input.in, select.in, textarea.in { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 11px; background: #fff; }
  input.in:focus, select.in:focus, textarea.in:focus { outline: none; border-color: var(--brand-dark); box-shadow: 0 0 0 3px var(--brand-soft); }
  input.in.besar { font-size: 20px; font-weight: 700; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { flex: 1 1 0; min-width: 0; padding: 10px 6px; border: 1.5px solid var(--line); background: #fff; border-radius: 11px;
    font-size: 14px; cursor: pointer; font-weight: 600; }
  .seg button.on { background: var(--brand); border-color: var(--brand-dark); color: var(--brand-ink); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .chips button { flex: none; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 14px;
    cursor: pointer; font-weight: 600; }
  .chips button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .bdg { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .bdg.gray { background: var(--gray-soft); color: var(--muted); }
  .bdg.amber { background: var(--amber-soft); color: var(--amber); }
  .bdg.blue { background: var(--blue-soft); color: var(--blue); }
  .bdg.green { background: var(--green-soft); color: var(--green); }
  .bdg.red { background: var(--red-soft); color: var(--red); }
  .item { padding: 12px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; padding-top: 2px; }
  .item[data-a] { cursor: pointer; }
  .item .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item .r1 b { min-width: 0; }
  .item .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item .r2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px; }
  .grup { border: 1.5px solid var(--line); border-radius: 13px; padding: 12px; margin-bottom: 12px; background: #fff; }
  .grup.mati { opacity: .6; }
  .grup.perlu { border-color: #E9C46A; background: #FFFBF0; }
  .grup-h { margin-bottom: 6px; }
  .grup-h .t { font-weight: 800; }
  .baris { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; }
  .baris .n { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .baris.min .n { color: var(--red); }
  .baris.ket { color: var(--muted); font-style: italic; }
  .baris.total { border-top: 1.5px solid var(--ink); margin-top: 4px; padding-top: 8px; font-weight: 800; font-size: 16px; }
  .note { border-radius: 11px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
  .note.ok { background: var(--green-soft); color: var(--green); }
  .note.warn { background: var(--amber-soft); color: var(--amber); }
  .note.bad { background: var(--red-soft); color: var(--red); }
  .note.info { background: var(--blue-soft); color: var(--blue); }
  .tbl-pemilik { width: 100%; border-collapse: collapse; }
  .tbl-pemilik th { font-size: 12px; color: var(--muted); text-align: left; padding: 4px 4px 6px; font-weight: 700; }
  .tbl-pemilik td { padding: 4px; vertical-align: middle; }
  .tbl-pemilik td.nm { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .tbl-pemilik input { width: 100%; padding: 10px 8px; border: 1.5px solid var(--line); border-radius: 10px; text-align: right; }
  .tbl-pemilik input:focus { outline: none; border-color: var(--brand-dark); }
  .pilih { width: 100%; text-align: left; padding: 12px; border: 1.5px dashed var(--brand-dark); border-radius: 12px; background: var(--brand-soft);
    color: var(--brand-2); font-weight: 700; cursor: pointer; }
  .pilih.terpilih { border-style: solid; background: #fff; color: var(--ink); }
  .opsi { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 12px;
    padding: 11px 12px; margin-bottom: 8px; cursor: pointer; }
  .radio { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
    margin-top: 8px; cursor: pointer; background: #fff; }
  .radio.on { border-color: var(--brand-dark); background: var(--brand-soft); }
  .radio .o { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex: none; margin-top: 2px; }
  .radio.on .o { border-color: var(--brand-dark); background: radial-gradient(var(--brand-dark) 45%, #fff 50%); }
  .cek { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .cek:first-child { border-top: 0; }
  .kotak { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); flex: none; display: flex;
    align-items: center; justify-content: center; color: transparent; font-weight: 900; font-size: 15px; background: #fff; }
  .cek.on .kotak, .kotak.on { background: var(--brand); border-color: var(--brand-dark); color: var(--brand-ink); }
  .cek .row b:last-child { white-space: nowrap; }
  .cek .row b:first-child { min-width: 0; }
  .foto-prev { margin-top: 8px; display: flex; gap: 10px; align-items: center; }
  .foto-prev img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .unggah { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 2px dashed var(--brand-dark); border-radius: 14px;
    padding: 22px 14px; background: var(--brand-soft); color: var(--brand-2); font-weight: 800; text-align: center; cursor: pointer; }
  .unggah input { display: none; }
  .unggah .ik { width: 44px; height: 44px; }
  .unggah .ik svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .imp-h { display: flex; gap: 10px; align-items: flex-start; }
  .imp-h .tx { flex: 1; min-width: 0; }
  .imp-pem { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .imp-pem b { color: var(--ink); font-weight: 700; }
  .akun-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .akun { border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; }
  .akun .av { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; color: #fff; background: var(--brand); }
  .akun .nm { font-weight: 800; }
  .akun .pr { font-size: 12px; color: var(--muted); }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .nav button { flex: 1; max-width: 120px; background: none; border: 0; padding: 4px 2px; font-size: 12px; font-weight: 700;
    color: var(--muted); cursor: pointer; position: relative; }
  .nav .ico { width: 52px; height: 30px; margin: 0 auto 2px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .nav svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav button.on { color: var(--brand-2); }
  .nav button.on .ico { background: #FFE38A; }
  .nav .nbdg { position: absolute; top: 0; left: 50%; margin-left: 8px; background: var(--red); color: #fff; border-radius: 999px;
    font-size: 11px; padding: 0 6px; line-height: 18px; min-width: 18px; }
  .sheet { position: fixed; inset: 0; z-index: 40; background: rgba(10,20,17,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-card { background: #fff; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .x { background: var(--gray-soft); border: 0; border-radius: 10px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; flex: none; }
  .dialog { position: fixed; inset: 0; z-index: 60; background: rgba(10,20,17,.5); display: flex; align-items: center; justify-content: center; padding: 18px; }
  .dialog-card { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; max-height: 85vh; overflow: auto; }
  .dialog-card h3 { font-size: 17px; }
  .dialog-card .isi { white-space: pre-line; font-size: 15px; color: var(--muted); margin-bottom: 14px; }
  .toast { position: fixed; bottom: calc(82px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 70; width: calc(100% - 28px); max-width: 520px;
    border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.15); display: none; }
  .toast.ok { display: block; background: var(--green); color: #fff; }
  .toast.bad { display: block; background: var(--red); color: #fff; }
  .loading { position: fixed; inset: 0; z-index: 80; background: rgba(255,255,255,.6); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; font-weight: 700; color: var(--brand-2); }
  .spinner { width: 38px; height: 38px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%;
    animation: putar .8s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }
  .err { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 1em; font-weight: 600; }
  .wa-head { background: #075E54; color: #fff; padding: 12px 14px; border-radius: 14px 14px 0 0; font-weight: 700; }
  .wa-body { background: #ECE5DD; padding: 14px; border-radius: 0 0 14px 14px; }
  .wa-bubble { background: #DCF8C6; border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; line-height: 1.4;
    box-shadow: 0 1px 1px rgba(0,0,0,.1); word-break: break-word; }
  .wa-bubble img { display: block; width: 100%; max-width: 260px; border-radius: 8px; margin-bottom: 8px; }
  .kosong { text-align: center; color: var(--muted); padding: 18px 6px; }
  .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 2px; border-top: 1px solid var(--line);
    cursor: pointer; font-weight: 700; }
  .menu-item:first-child { border-top: 0; }
  .panduan ol { padding-left: 20px; margin: 6px 0; }
  .panduan li { margin-bottom: 6px; }
  .cari { position: sticky; top: -16px; background: #fff; padding-bottom: 8px; }
  .lengket { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 5; }
  /* dasbor */
  .dsb-judul { margin: 2px 0 12px; }
  .dsb-judul h2 { margin: 0; font-size: 21px; }
  .dsb-sub { font-size: 13px; color: var(--muted); }
  .dsb-bagian { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 18px 2px 8px; }
  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
  .tile .l { font-size: 13px; color: var(--muted); font-weight: 700; line-height: 1.3; }
  .tile .v { font-size: 21px; font-weight: 800; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .d { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .tile.merah { border-color: #F2B8B5; background: var(--red-soft); }
  .tile.merah .v { color: var(--red); }
  .tile.kuning { border-color: #F1D59A; background: #FFF8E8; }
  .tile.hijau { border-color: #B9DFC8; background: #F1FAF4; }
  .lampu { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 4px; }
  .lampu.hijau { background: var(--green); } .lampu.kuning { background: #E0A100; } .lampu.merah { background: var(--red); }
  .lampu.abu { background: #B8C4BF; }
  .pj-baris { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); }
  .pj-baris:first-child { border-top: 0; padding-top: 2px; }
  .pj-baris[data-a] { cursor: pointer; }
  .pj-baris .tx { flex: 1; min-width: 0; }
  .pj-baris .kanan { text-align: right; white-space: nowrap; }
  .angka-besar { font-size: 28px; font-weight: 800; line-height: 1.15; }
  .grafik { width: 100%; height: auto; display: block; margin-top: 6px; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .komp-bar { display: flex; height: 24px; border-radius: 12px; overflow: hidden; margin: 10px 0 8px; background: var(--gray-soft); }
  .komp-bar span { display: block; height: 100%; }
  .komp-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--line); }
  .komp-item:first-of-type { border-top: 0; }
  .komp-item .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .komp-item .p { margin-left: auto; font-weight: 800; white-space: nowrap; }
  .komp-item .r { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 64px; text-align: right; }
  .progres { height: 12px; background: var(--gray-soft); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; display: flex; }
  .progres span { display: block; height: 100%; }
  .cek-item { padding: 11px 0; border-top: 1px solid var(--line); }
  .cek-item:first-of-type { border-top: 0; }
  .cek-item[data-a] { cursor: pointer; }
  .cek-item .u { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .cek-item .c { font-size: 13px; margin-top: 4px; color: var(--blue); }
  .batang { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #FFD84D, var(--brand)); margin-top: 4px; }
  .tbl.kecil td, .tbl.kecil th { font-size: 13px; }
  .catatan-kaki { font-size: 12px; color: var(--muted); margin: 6px 2px 14px; line-height: 1.45; }
  /* layar pembuka: huruf SIBAGI muncul satu-satu, mahkota meloncat dari balik tulisan, lalu hujan uang (±3,3 detik, ketuk untuk lewati).
     Animasi baru jalan setelah skrip memberi kelas .main, jadi semua bagian mulai serempak. */
  .pembuka { position: fixed; inset: 0; z-index: 100; overflow: hidden; display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; background: radial-gradient(120% 80% at 50% 40%, #3A2E12 0%, #17140D 52%, #0B0B0B 100%);

<script>
(function () {
  'use strict';

  // ================= logika bersama (disalin otomatis dari Code.gs oleh build.py)
  var NAMA_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September',
    'Oktober', 'November', 'Desember'];
  var BULAN_PENDEK = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  
  function tarifPemilik(tarif, komisi) {
    return Math.round((tarif - komisi) * 100) / 100;
  }
  
  function hitungTagihan(p, rincian, set, ov) {
    ov = ov || {};
    var tarif = ov.tarif != null ? ov.tarif : p.tarif;
    var komisi = ov.komisi != null ? ov.komisi : p.komisi;
    var rit = 0, kg = 0;
    rincian.forEach(function (r) { rit += r.rit; kg += r.kg; });
    var dpp = Math.round(kg * tarif);
    var nilaiPpn = p.ppn === 'YA' ? Math.round(dpp * set.ppnPersen / 100) : 0;
    var pphPabrik = p.pph === 'YA' ? Math.round(dpp * set.pphPersen / 100) : 0;
    return {
      tarif: tarif, komisi: komisi, tarifPemilik: tarifPemilik(tarif, komisi), ppn: p.ppn, pph: p.pph, jenis: p.jenis,
      rit: rit, kg: kg, dpp: dpp, nilaiPpn: nilaiPpn, pphPabrik: pphPabrik, harus: dpp + nilaiPpn - pphPabrik,
      bhsKg: set.bhsKg, kasRit: set.kasRit, feeRit: set.feeRit, kasSludge: set.kasSludge ? 'YA' : 'TIDAK'
    };
  }
  
  function hakPenuh(t, rincian, set, pm) {
    var out = [];
    var pphP = t.pph === 'YA' ? set.pphPersen : 0;
    if (t.jenis !== 'SLUDGE') {
      rincian.forEach(function (r) {
        if (!r.rit && !r.kg) return;
        var bruto = Math.round(r.kg * t.tarifPemilik);
        out.push({ penerima: r.penerima, nama: r.nama, rit: r.rit, kg: r.kg, bruto: bruto,
          pph: Math.round(bruto * pphP / 100), bhs: Math.round(r.kg * t.bhsKg), kas: r.rit * t.kasRit, fee: 0 });
      });
    } else {
      var totFee = 0, totRit = 0, totKg = 0;
      rincian.forEach(function (r) {
        if (!r.rit && !r.kg) return;
        totRit += r.rit;
        totKg += r.kg;
        var fee = r.rit * t.feeRit;
        totFee += fee;
        out.push({ penerima: r.penerima, nama: r.nama, rit: r.rit, kg: r.kg, bruto: 0, pph: 0, bhs: 0, kas: 0, fee: fee });
      });
      var bruto = Math.round(totKg * t.tarifPemilik);
      var su = (pm && pm[set.sludgeUntuk]) || { kode: set.sludgeUntuk, nama: set.sludgeUntuk };
      out.push({ penerima: su.kode, nama: su.nama, rit: totRit, kg: totKg, bruto: bruto, pph: Math.round(bruto * pphP / 100),
        bhs: 0, kas: t.kasSludge === 'YA' ? totRit * t.kasRit : 0, fee: -totFee, sludge: true });
    }
    out.forEach(function (h) { h.hak = h.bruto - h.pph - h.bhs - h.kas + h.fee; });
    return out;
  }
  
  function bagiPorsi(hak, fLama, fBaru) {
    var komp = ['bruto', 'pph', 'bhs', 'kas', 'fee'];
    return hak.map(function (h) {
      var s = { penerima: h.penerima, nama: h.nama, rit: h.rit, kg: h.kg, sludge: !!h.sludge };
      komp.forEach(function (k) { s[k] = Math.round(h[k] * fBaru) - Math.round(h[k] * fLama); });
      s.hak = s.bruto - s.pph - s.bhs - s.kas + s.fee;
      return s;
    }).filter(function (s) { return s.bruto || s.pph || s.bhs || s.kas || s.fee; });
  }
  
  function fraksiCair(t, sebelum, nominal, perlakuan, set) {
    var sudah = 0, fLama = 0;
    sebelum.forEach(function (c) { sudah += c.nominal; fLama = Math.max(fLama, c.fraksi); });
    var total = sudah + nominal;
    var selisih = total - t.harus;
    var cocok = Math.abs(selisih) <= set.toleransi;
    var kurang = !cocok && selisih < 0;
    var fBaru = (!kurang || perlakuan === 'LUNAS') ? 1 : Math.round(total / t.harus * 1e6) / 1e6;
    if (fBaru > 1) fBaru = 1;
    return { sudah: sudah, total: total, selisih: selisih, cocok: cocok, kurang: kurang, fLama: fLama, fBaru: fBaru };
  }
  
  function namaBulan(k) {
    var s = String(k).replace('-', '');
    return NAMA_BULAN[Number(s.slice(4, 6)) - 1] + ' ' + s.slice(0, 4);
  }
  
  function bulanPendek(k) {
    var s = String(k).replace('-', '');
    return BULAN_PENDEK[Number(s.slice(4, 6)) - 1] + ' ' + s.slice(0, 4);
  }
  
  function tglIndo(s) {
    if (!s) return '';
    return Number(s.slice(8, 10)) + ' ' + BULAN_PENDEK[Number(s.slice(5, 7)) - 1] + ' ' + s.slice(0, 4);
  }
  
  function ribu(n) {
    return String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  
  function rp(n) {
    n = Math.round(Number(n) || 0);
    return (n < 0 ? '-Rp ' : 'Rp ') + ribu(n);
  }
  
  function rpTarif(n) {
    n = Number(n) || 0;
    var bulat = Math.floor(Math.abs(n));
    var sisa = Math.round((Math.abs(n) - bulat) * 100);
    return (n < 0 ? '-Rp ' : 'Rp ') + ribu(bulat) + (sisa ? ',' + String(sisa).replace(/0$/, '') : '');
  }
  
  function desimal_(x) {
    if (typeof x === 'number') return x;
    var s = String(x == null ? '' : x).trim().replace(/[^\d.,]/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') >= 0) {
      s = s.replace(/\./g, '').replace(/,(?=.*,)/g, '').replace(',', '.');
    } else if (s.indexOf('.') >= 0) {
      if (s.slice(s.lastIndexOf('.') + 1).length === 3) s = s.replace(/\./g, '');
      else s = s.replace(/\.(?=.*\.)/g, '');
    }
    return Number(s);
  }
  
  function waLink_(no, teks) {
    var n = String(no || '').replace(/[^\d]/g, '').replace(/^0/, '62');
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(teks);
  }
  
  function labelPotongan(p) {
    return p.jenis === 'Lainnya' && p.ket ? p.ket.charAt(0).toUpperCase() + p.ket.slice(1) : p.jenis + (p.ket ? ': ' + p.ket : '');
  }
  
  function batasPajak(masa, jenis) {
    var y = Math.floor(masa / 100), m = masa % 100 + 1;
    if (m > 12) { m = 1; y++; }
    var mm = (m < 10 ? '0' : '') + m;
    if (jenis === 'PPN') return y + '-' + mm + '-' + new Date(Date.UTC(y, m, 0)).getUTCDate();
    if (/^PPh/.test(jenis)) return y + '-' + mm + '-15';
    return '';
  }

  // ================= pembaca rekap PDF (disalin otomatis dari _dev/rekap_pdf.js)
  /**
   * Pembaca rekap tarikan Lala (PDF "REKAPITULASI TOTAL JUMLAH TARIKAN <BULAN> <TAHUN>").
   * Masukan: potongan teks per halaman dari pdf.js, masing-masing {s, x, y, w} (koordinat PDF, y naik ke atas).
   * Kolom tiap pemilik dicari dari judul kolomnya sendiri (nama pemilik + "Jumlah RIT"/"Total KG"),
   * jadi tetap jalan walau ukuran halaman, skala, atau format angka berubah dari bulan ke bulan.
   * Halaman tanpa judul pemilik (misal tabel sludge/kemasan per jenis limbah di rekap 2025) dilewati.
   * Disalin build.py ke Index.html; diuji di _dev/uji_rekap.js dengan rekap asli 2025.
   */
  var BULAN_REKAP = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER',
    'NOVEMBER', 'DESEMBER'];
  
  /** Angka rekap: "36.810", "66,700", "16,540.0", "2.961.210,0", "-" (nol). Pemisah terakhir diikuti 3 angka = ribuan. */
  function angkaRekap(s) {
    s = String(s == null ? '' : s).replace(/\s+/g, '');
    if (s === '-' || s === '–') return 0;
    if (!/^\d[\d.,]*$/.test(s)) return null;
    var i = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
    if (i < 0) return Number(s);
    if (s.length - i - 1 === 3) return Number(s.replace(/[.,]/g, ''));
    return Number(s.slice(0, i).replace(/[.,]/g, '') + '.' + s.slice(i + 1));
  }
  
  function normRekap(s) {
    return String(s == null ? '' : s).toUpperCase().replace(/\s+/g, ' ').trim();
  }

      yatim.sort(function (a, b) { return b.y - a.y; }).forEach(function (it) {

    fmt = fmt || rp;
    var hemat = false;
    try { hemat = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { hemat = false; }
    if (hemat || !nilai) { el.textContent = fmt(nilai); return; }
    var mulai = null;
    var langkah = function (t) {
      if (mulai === null) mulai = t;
      var p = Math.min(1, (t - mulai) / 700);
      el.textContent = fmt(Math.round(nilai * (1 - Math.pow(1 - p, 3))));
      if (p < 1 && document.body.contains(el)) requestAnimationFrame(langkah);
    };
    el.textContent = fmt(0);
    requestAnimationFrame(langkah);
  }

  /** Ledakan konfeti (jenis 'uang' = lembar dolar + koin). */
  function hujanKonfeti(n, jenis) {
    var w = Math.min(window.innerWidth || 400, 560), wadah = document.createElement('div');
    var warna = ['#F5B400', '#FFD84D', '#7DB363', '#FFFFFF', '#D42A45', '#FFE38A'];
    wadah.className = 'konfeti-wadah';
    var h = '';
    for (var i = 0; i < n; i++) {
      var sudut = Math.random() * Math.PI * 2, jarak = 70 + Math.random() * w * 0.48;
      var kelas = jenis === 'uang' ? (i % 3 === 2 ? 'k-koin' : 'k-lembar') : (i % 4 === 0 ? 'bulat' : '');
      h += '<i class="konfeti ' + kelas + '" style="--x:' + Math.round(Math.cos(sudut) * jarak) + 'px;--y:' + Math.round(Math.sin(sudut) * jarak * 0.8 - 90) +
        'px;--j:' + Math.round(220 + Math.random() * 280) + 'px;--r:' + Math.round(Math.random() * 720 - 360) + 'deg;--t:' + (1.1 + Math.random() * 0.8).toFixed(2) + 's' +
        (jenis === 'uang' ? '' : ';background:' + warna[i % warna.length]) + '"></i>';
    }
    wadah.innerHTML = h;
    document.body.appendChild(wadah);
    setTimeout(function () { wadah.remove(); }, 2200);

        (bukti ? ' dengan foto bukti transfernya' : '') + '. Di mode latihan cuma ditampilkan.</div></div><button class="x" data-a="tutupSheet" aria-label="Tutup">×</button></div>' +

        html + '</div></div><button class="btn" style="margin-top:12px" data-a="tutupSheet">Selesai</button>');

  function b64keBlob(b64, mime) {
    var bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);

  function bolehShare() {
    try {
      var kebijakan = document.permissionsPolicy || document.featurePolicy;
      if (kebijakan && kebijakan.allowsFeature && !kebijakan.allowsFeature('web-share')) return false;
    } catch (e) { /* browser lama */ }
    return !!(navigator.share && navigator.canShare);
  }
  /** Kirim slip + foto bukti. Di HP yang mendukung, langsung ke menu Bagikan (pilih WhatsApp); selain itu teks + link bukti. */
  function bagikan(teks, bukti, urlWa, kepada, lalu) {
    if (window.SIBAGI_LATIHAN) { bukaWa(urlWa, kepada, lalu, bukti); return; }
    var file = null;
    try { if (bukti && bolehShare()) file = new File([b64keBlob(bukti.b64, bukti.mime)], bukti.nama || 'bukti.jpg', { type: bukti.mime }); } catch (e) { file = null; }
    if (file && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], text: teks }).then(function () { if (lalu) lalu(); }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        bukaWa(urlWa, kepada, lalu);
      });
      return;
    }
    bukaWa(urlWa, kepada, lalu);
  }

    var n = { BELUM: 0, SEBAGIAN: 0, LUNAS: 0 };
    S.tagihan.forEach(function (t) { n[t.statusBayar]++; });
    var daftar = S.tagihan.filter(function (t) { return filterTg === 'SEMUA' || t.statusBayar === filterTg; });
    var tombol = (S.peran !== 'PENYETUJU' ? '<div class="row" style="gap:8px"><button class="btn sm ghost" data-a="nav" data-v="impor" id="btnImporTg">Impor PDF</button>' +
      '<button class="btn sm" data-a="nav" data-v="tagihanBaru" id="btnTagihanBaru2">+ Manual</button></div>' : '');
    var h = kepala('Tagihan', null, tombol);
    h += '<div class="chips">' + [['BELUM', 'Belum cair'], ['SEBAGIAN', 'Sebagian'], ['LUNAS', 'Lunas'], ['SEMUA', 'Semua']].map(function (c) {
      return '<button data-a="filterTg" data-v="' + c[0] + '" class="' + (filterTg === c[0] ? 'on' : '') + '">' + c[1] +
        (c[0] !== 'SEMUA' ? ' (' + n[c[0]] + ')' : '') + '</button>';
    }).join('') + '</div>';
    if (!daftar.length) return h + '<div class="card kosong">Tidak ada tagihan di sini.</div>';
    h += '<div class="card">' + daftar.map(function (t) {
      return '<div class="item" data-a="tagihanDetail" data-v="' + t.id + '" id="tg-' + t.id + '"><div class="r1"><b>' + esc(t.namaPabrik) +
        ' · ' + bulanPendek(t.bulan) + '</b>' + bdgBayar(t) + '</div><div class="d">' + t.rit + ' rit · ' + ribu(t.kg) + ' kg' +
        (t.invoice ? ' · ' + esc(t.invoice) : '') + '</div><div class="r2"><span class="small muted">' +
        (t.statusBayar === 'LUNAS' ? 'masuk ' + rp(t.masuk) : t.umur + ' hari sejak invoice' + (t.masuk ? ' · sudah masuk ' + rp(t.masuk) : '')) +
        '</span><b>' + rp(t.harus) + '</b></div></div>';
    }).join('') + '</div>';
    return h;
  };

  function sheetTagihan(id) {
    var t = tagihanById(id);
    if (!t) return;
    var cair = S.cair.filter(function (c) { return c.tagihan === t.id; });
    var h = '<div class="sheet-top"><div><h2 style="margin:0">' + esc(t.namaPabrik) + ' · ' + bulanPendek(t.bulan) + '</h2><div class="muted small">' +
      t.id + (t.invoice ? ' · ' + esc(t.invoice) : '') + (t.periode ? ' · ' + esc(t.periode) : '') + ' · dicatat ' + esc(t.oleh) + '</div></div>' +
      '<button class="x" data-a="tutupSheet" aria-label="Tutup">×</button></div>' + bdgBayar(t);
    h += '<h3 style="margin-top:14px">Nilai tagihan</h3>' + barisHtml([
      [t.rit + ' rit · ' + ribu(t.kg) + ' kg × ' + rpTarif(t.tarif), t.dpp],
      ['PPN ' + (t.ppn === 'YA' ? S.set.ppnPersen + '%' : '(tidak kena)'), t.nilaiPpn],
      ['PPh 23 dipotong pabrik', -t.pphPabrik]
    ].filter(function (x) { return x[1] !== 0 || x[0].indexOf('PPh') < 0; })) +
      '<div class="baris total"><span>Harus diterima</span><span class="n">' + rp(t.harus) + '</span></div>';
    if (t.totalKontrabon) {
      var beda = t.totalKontrabon - (t.dpp + t.nilaiPpn);
      h += Math.abs(beda) <= 10 ? '<div class="note ok small">Cocok dengan kontrabon (' + rp(t.totalKontrabon) + ').</div>' :
        '<div class="note warn small">Kontrabon ' + rp(t.totalKontrabon) + ', beda ' + rp(beda) + ' dari hitungan.</div>';
    }
    if (t.sumber) {
      h += '<div class="small muted" style="margin-top:6px">Sumber: ' + (/^https?:/.test(t.sumber) ? '<a class="link" href="' + esc(t.sumber) +
        '" target="_blank" rel="noopener">rekap PDF dari Lala</a>' : 'rekap PDF (latihan)') + '</div>';
    }
    h += '<h3 style="margin-top:14px">Hak per pemilik (kalau lunas)</h3><div class="muted small" style="margin-bottom:4px">Tarif pemilik ' +
      rpTarif(t.tarifPemilik) + '/kg (tarif ' + rpTarif(t.tarif) + ' − komisi ' + rpTarif(t.komisi) + ')</div>';
    h += t.rincian.map(function (r) {
      return '<div class="baris"><span><b>' + esc(r.nama) + '</b> · ' + r.rit + ' rit · ' + ribu(r.kg) + ' kg</span><span class="n">' + rp(r.hak) + '</span></div>';
    }).join('');
    if (t.hasilSludge) h += '<div class="baris"><span><b>' + esc(t.hasilSludge.nama) + '</b> · hasil sludge</span><span class="n">' + rp(t.hasilSludge.hak) + '</span></div>';
    h += '<h3 style="margin-top:14px">Uang masuk</h3>';
    h += cair.length ? cair.map(function (c) {
      return '<div class="item"><div class="r1"><b>' + rp(c.nominal) + '</b><span class="small muted">' + tglIndo(c.tanggal) + '</span></div><div class="d">' +
        esc(c.rekening) + ' · ' + c.id + (c.perlakuan ? ' · ' + esc(c.perlakuan === 'SEBAGIAN' ? 'bayar sebagian' : c.perlakuan === 'LUNAS' ? 'dianggap lunas' : 'lebih bayar') : '') +
        (c.alasan ? ' (' + esc(c.alasan) + ')' : '') + '</div>' + (c.bolehBatal && isKeu() ? '<button class="link merah" data-a="batalCair" data-v="' + c.id + '">Batalkan uang cair ini</button>' : '') + '</div>';
    }).join('') : '<div class="muted small">Belum ada.</div>';
    if (t.catatan) h += '<div class="note info small">' + esc(t.catatan) + '</div>';
    if (S.peran !== 'PENYETUJU') {
      h += '<div style="margin-top:14px">';
      if (t.statusBayar !== 'LUNAS' && isKeu()) h += '<button class="btn" data-a="cairUntuk" data-v="' + t.id + '">Catat uang cair tagihan ini</button>';
      if (t.bolehBatal) {
        h += '<div class="dua" style="margin-top:10px"><button class="btn ghost" data-a="perbaikiTagihan" data-v="' + t.id + '">Perbaiki</button>' +
          '<button class="btn danger" data-a="batalTagihan" data-v="' + t.id + '">Batalkan</button></div>';
      }
      h += '</div>';
    }
    bukaSheet('tagihan', id, h);
  }

  // ---------- tagihan: form manual / perbaiki
  function mulaiFormTagihan(dari) {
    F = { jenisForm: 'tagihan', pabrik: '', bulan: bulanGeser(S.hariIni.slice(0, 7), -1), invoice: '', tglInvoice: S.hariIni,
      periode: '', catatan: '', totalKontrabon: '', rincian: {}, ov: false, tarif: '', komisi: '', edit: null };
    if (dari) {
      F.edit = dari.id;
      F.pabrik = dari.pabrik;
      F.bulan = String(dari.bulan).slice(0, 4) + '-' + String(dari.bulan).slice(4, 6);
      F.invoice = dari.invoice;
      F.tglInvoice = dari.tglInvoice || S.hariIni;
      F.periode = dari.periode;
      F.catatan = dari.catatan;
      F.totalKontrabon = dari.totalKontrabon ? ribu(dari.totalKontrabon) : '';
      dari.rincian.forEach(function (r) { F.rincian[r.penerima] = { rit: String(r.rit), kg: ribu(r.kg) }; });
      var p = pabrikByKode(dari.pabrik);
      if (p && (p.tarif !== dari.tarif || p.komisi !== dari.komisi)) { F.ov = true; F.tarif = String(dari.tarif).replace('.', ','); F.komisi = String(dari.komisi).replace('.', ','); }
    }
  }
  function pabrikByKode(k) { return S.pabrik.filter(function (p) { return p.kode === k; })[0]; }
  function pemilikArmada() { return S.penerima.filter(function (p) { return p.peran === 'Pemilik armada'; }); }

  VIEWS.tagihanBaru = function () {
    if (F.jenisForm !== 'tagihan') mulaiFormTagihan();
    var p = pabrikByKode(F.pabrik);
    var h = kepala(F.edit ? 'Perbaiki tagihan' : 'Tagihan manual', 'tagihan');
    if (!F.edit) h += '<div class="note info small">Punya rekap PDF dari Lala? <button class="link" data-a="nav" data-v="impor">Impor PDF saja</button>, lebih cepat.</div>';
    h += '<div class="card"><label class="lb">Pabrik</label><button class="pilih' + (p ? ' terpilih' : '') + '" data-a="pilihPabrikBuka" id="btnPilihPabrik">' +
      (p ? esc(p.nama) + ' <span class="bdg ' + (p.jenis === 'SLUDGE' ? 'amber' : 'blue') + '">' + p.jenis + '</span>' : 'Ketuk untuk pilih pabrik…') + '</button>';
    if (p) h += infoPabrik(p);
    h += '<div class="grid2"><div><label class="lb" for="fBulan">Bulan tarikan</label><input id="fBulan" class="in" type="month" value="' + esc(F.bulan) +
      '" max="' + S.hariIni.slice(0, 7) + '"></div><div><label class="lb" for="fTglInv">Tanggal invoice</label><input id="fTglInv" class="in" type="date" value="' +
      esc(F.tglInvoice) + '" max="' + S.hariIni + '"></div></div>';
    h += '<label class="lb" for="fInvoice">No invoice (kalau ada)</label><input id="fInvoice" class="in" value="' + esc(F.invoice) + '" placeholder="misal INV 450">';
    h += '<label class="lb" for="fPeriode">Keterangan periode (kalau perlu)</label><input id="fPeriode" class="in" value="' + esc(F.periode) + '" placeholder="misal PO 4800001234">';
    h += '<div id="boxDobel"></div></div>';
    h += '<div class="card"><h2>Rit dan kg per pemilik</h2><div class="muted small">Salin dari rekap tarikan Lala, baris pabrik ini. Kosongkan pemilik yang tidak narik.</div>' +
      '<table class="tbl-pemilik"><thead><tr><th>Pemilik</th><th style="width:70px">Rit</th><th style="width:130px">Kg</th></tr></thead><tbody>' +
      pemilikArmada().map(function (o) {
        var r = F.rincian[o.kode] || { rit: '', kg: '' };
        return '<tr><td class="nm">' + esc(o.nama) + '</td><td><input class="rit" data-p="' + o.kode + '" id="rit-' + o.kode + '" inputmode="numeric" value="' + esc(r.rit) +
          '"></td><td><input class="kg" data-p="' + o.kode + '" id="kg-' + o.kode + '" inputmode="numeric" value="' + esc(r.kg) + '"></td></tr>';
      }).join('') + '</tbody></table></div>';
    h += '<div class="card" id="pvTagihan"></div>';
    h += '<div class="card"><label class="lb" for="fKontrabon">Cek: total di kontrabon (DPP + PPN), kalau ada</label><input id="fKontrabon" class="in uang" inputmode="numeric" value="' +
      esc(F.totalKontrabon) + '" placeholder="boleh kosong"><div id="cekKontrabon"></div>' +
      '<label class="lb" for="fCatatan">Catatan (kalau perlu)</label><input id="fCatatan" class="in" value="' + esc(F.catatan) + '">' +
      '<div id="errTagihan" class="err"></div><button class="btn" data-a="simpanTagihan" id="btnSimpanTagihan">' + (F.edit ? 'Simpan perbaikan' : 'Simpan tagihan') + '</button></div>';
    return h;
  };
  function infoPabrik(p) {
    var h = '<div class="note ' + (p.masalah ? 'bad' : p.cekKomisi === 'Perlu dicek Bapak' ? 'warn' : 'info') + ' small">';
    if (p.masalah) {
      h += '<b>' + esc(p.masalah) + '.</b> Lengkapi dulu di menu Pabrik (tanya Bapak untuk komisinya).';
    } else {
      h += 'Tarif ' + rpTarif(F.ov && F.tarif ? desimal(F.tarif) : p.tarif) + '/kg · komisi ' + rpTarif(F.ov && F.komisi !== '' ? desimal(F.komisi) : p.komisi) +
        '/kg' + (p.agen ? ' (' + esc(p.agen) + ')' : '') + ' · PPN ' + (p.ppn === 'YA' ? 'ya' : 'tidak') + ' · PPh 23 ' + (p.pph === 'YA' ? 'dipotong' : 'tidak');
      if (p.cekKomisi === 'Perlu dicek Bapak') h += '<br><b>Komisi belum dicek Bapak.</b> Boleh lanjut, tapi minta Bapak cek.';
      if (p.jenis === 'SLUDGE' && !S.set.sludgeOk) h += '<br><b>Aturan sludge belum dikonfirmasi Bapak.</b> Hitungan pakai fee truk ' + rp(S.set.feeRit) + '/rit, sisanya untuk ' + esc(S.set.namaSludgeUntuk) + '.';
    }
    h += '</div>';
    if (!p.masalah) {
      h += F.ov ? '<div class="grid2"><div><label class="lb" for="fTarif">Tarif khusus (Rp/kg)</label><input id="fTarif" class="in" inputmode="decimal" value="' + esc(F.tarif) +
        '"></div><div><label class="lb" for="fKomisi">Komisi khusus (Rp/kg)</label><input id="fKomisi" class="in" inputmode="decimal" value="' + esc(F.komisi) + '"></div></div>' +
        '<button class="link" data-a="ovTarif" data-v="0">Pakai tarif biasa</button>' :
        '<button class="link" data-a="ovTarif" data-v="1">Tarif bulan ini beda? Ubah untuk tagihan ini saja</button>';
    }
    return h;
  }
  function desimal(x) { return desimal_(x); }
  function bacaFormTagihan() {
    if (!$('fBulan')) return;
    F.bulan = $('fBulan').value;
    F.tglInvoice = $('fTglInv').value;
    F.invoice = $('fInvoice').value;
    F.periode = $('fPeriode').value;
    F.totalKontrabon = $('fKontrabon').value;
    F.catatan = $('fCatatan').value;
    if ($('fTarif')) { F.tarif = $('fTarif').value; F.komisi = $('fKomisi').value; }
    Array.prototype.forEach.call(document.querySelectorAll('.rit'), function (el) {
      var k = el.getAttribute('data-p');
      F.rincian[k] = F.rincian[k] || {};
      F.rincian[k].rit = el.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('.kg'), function (el) {
      var k = el.getAttribute('data-p');
      F.rincian[k] = F.rincian[k] || {};
      F.rincian[k].kg = el.value;
    });
  }
  function rincianForm() {
    return pemilikArmada().map(function (o) {
      var r = F.rincian[o.kode] || {};
      return { penerima: o.kode, nama: o.nama, rit: angka(r.rit), kg: angka(r.kg) };
    }).filter(function (r) { return r.rit || r.kg; });
  }
  function setKlien() {
    return { ppnPersen: S.set.ppnPersen, pphPersen: S.set.pphPersen, bhsKg: S.set.bhsKg, kasRit: S.set.kasRit, feeRit: S.set.feeRit,
      kasSludge: S.set.kasSludge, sludgeUntuk: S.set.sludgeUntuk, toleransi: S.set.toleransi };
  }
  function pmKlien() { var m = {}; S.penerima.forEach(function (p) { m[p.kode] = p; }); return m; }
  function previewTagihan() {
    var box = $('pvTagihan');
    if (!box) return;
    var p = pabrikByKode(F.pabrik);
    var rin = rincianForm();
    var sama = p ? S.tagihan.filter(function (t) {
      return t.pabrik === p.kode && String(t.bulan) === String(F.bulan).replace('-', '') && t.id !== F.edit;
    }) : [];
    var awas = sama.length ? '<div class="note warn small" id="awasDobel">Sudah ada tagihan ' + esc(p.nama) + ' ' + namaBulan(F.bulan) + ': ' + sama.map(function (t) {
      return t.id + (t.invoice ? ' (' + esc(t.invoice) + ')' : ' (tanpa No invoice' + (t.sumber ? ', dari impor rekap' : '') + ')');
    }).join(', ') + '. Kalau cuma mau menambah No invoice, buka tagihan itu lalu Perbaiki. Tagihan kedua hanya bisa disimpan kalau dua-duanya punya No invoice yang berbeda.</div>' : '';
    if ($('boxDobel')) $('boxDobel').innerHTML = awas;
    if (!p || p.masalah) { box.innerHTML = '<div class="muted small">Pilih pabrik yang datanya lengkap, lalu isi rit dan kg.</div>'; return; }
    if (!rin.length) { box.innerHTML = '<div class="muted small">Isi rit dan kg, hitungannya muncul di sini.</div>'; return; }
    var ov = {};
    if (F.ov) {
      if (F.tarif !== '' && desimal(F.tarif) > 0) ov.tarif = desimal(F.tarif);
      if (F.komisi !== '' && desimal(F.komisi) >= 0) ov.komisi = desimal(F.komisi);
    }
    var t = hitungTagihan(p, rin, setKlien(), ov);
    var hak = hakPenuh(t, rin, setKlien(), pmKlien());
    var h = '<h2>Hitungan</h2>' + barisHtml([
      [t.rit + ' rit · ' + ribu(t.kg) + ' kg × ' + rpTarif(t.tarif) + ' (DPP)', t.dpp],
      ['PPN ' + (t.ppn === 'YA' ? S.set.ppnPersen + '%' : '(tidak kena)'), t.nilaiPpn],
      ['PPh 23 dipotong pabrik (' + S.set.pphPersen + '%)', -t.pphPabrik]
    ].filter(function (x) { return x[1] !== 0 || x[0].indexOf('PPh') < 0; })) +
      '<div class="baris total"><span>Uang yang harus masuk</span><span class="n" id="pvHarus">' + rp(t.harus) + '</span></div>';
    h += '<h3 style="margin-top:14px">Perkiraan hak per pemilik</h3>' + hak.map(function (x) {
      return '<div class="baris"><span>' + esc(x.nama) + (x.sludge ? ' (hasil sludge)' : '') + '</span><span class="n">' + rp(x.hak) + '</span></div>';
    }).join('');
    box.innerHTML = h;
    var k = angka(F.totalKontrabon), cek = $('cekKontrabon');
    if (cek) {
      if (!k) cek.innerHTML = '';
      else {
        var beda = k - (t.dpp + t.nilaiPpn);
        cek.innerHTML = Math.abs(beda) <= 10 ? '<div class="note ok small">Cocok dengan kontrabon.</div>' :
          '<div class="note warn small">Beda ' + rp(beda) + ' dari hitungan (' + rp(t.dpp + t.nilaiPpn) + '). Cek rit/kg atau tarifnya.</div>';
      }
    }
  }
  SETELAH.tagihanBaru = function () { previewTagihan(); };

  function sheetPilihPabrik() {
    var h = '<div class="sheet-top"><h2 style="margin:0">Pilih pabrik</h2><button class="x" data-a="tutupSheet" aria-label="Tutup">×</button></div>' +
      '<div class="cari"><input id="cariPabrik" class="in" placeholder="Ketik nama pabrik…" autocomplete="off"></div><div id="daftarPabrik"></div>';
    bukaSheet('pilihPabrik', null, h);
    isiDaftarPabrik('');
    setTimeout(function () { var c = $('cariPabrik'); if (c && !window.SIBAGI_REKAM) c.focus(); }, 80);
  }
  function isiDaftarPabrik(q) {
    q = q.trim().toUpperCase();
    var daftar = S.pabrik.filter(function (p) {
      return p.aktif !== 'TIDAK' && (!q || p.nama.indexOf(q) >= 0 || String(p.namaKontrabon).toUpperCase().indexOf(q) >= 0);
    });
    $('daftarPabrik').innerHTML = daftar.length ? daftar.map(function (p) {
      return '<button class="opsi" data-a="pilihPabrik" data-v="' + p.kode + '" id="pb-' + p.kode + '"><div class="row"><b>' + esc(p.nama) + '</b><span class="bdg ' +
        (p.jenis === 'SLUDGE' ? 'amber' : 'blue') + '">' + p.jenis + '</span></div><div class="small ' + (p.masalah ? '' : 'muted') + '" style="' +
        (p.masalah ? 'color:var(--red)' : '') + '">' + (p.masalah ? esc(p.masalah) : 'Tarif ' + rpTarif(p.tarif) + ' · komisi ' + rpTarif(p.komisi) +
        ' · PPN ' + (p.ppn === 'YA' ? 'ya' : 'tidak')) + '</div></button>';
    }).join('') : '<div class="kosong">Tidak ketemu. Tambahkan dulu di menu Pabrik.</div>';
  }

  // ---------- impor rekap PDF

      ribu(total.kg) + ' kg' + (F.kosong ? ' · ' + F.kosong + ' pabrik kosong dilewati' : '') + '</div></div><button class="link" data-a="imporUlang">Ganti file</button></div>' +
      (F.hasil.cocokJumlah ? '<div class="note ok small">Jumlah semua baris sama dengan total di PDF. Angkanya terbaca utuh.</div>' :
        '<div class="note warn small">Total hasil baca (' + total.rit + ' rit · ' + ribu(total.kg) + ' kg) ' + (F.hasil.jumlahPdf ? 'beda dengan total di PDF (' + F.hasil.jumlahPdf.rit + ' rit · ' +

  function muatPdfJs() {

  /** Ambil teks slip + foto bukti lebih dulu, supaya tombol kirim langsung membuka menu Bagikan HP. */
  function siapkanKirim(t) {
    var k = siapKirim[t.id] = { memuat: true };
    var sesudah = function () { if (sheetAktif && sheetAktif.jenis === 'transfer' && sheetAktif.id === t.id) sheetTransfer(t.id); };
    panggil('teksSlip', { id: t.id }, null, true).then(function (r) {
      k.teks = r.teks;
      k.wa = r.wa;
      k.nama = r.nama;
      if (!t.foto) { k.memuat = false; sesudah(); return null; }
      return panggil('buktiTransfer', { id: t.id }, null, true).then(function (b) { k.bukti = b; }).catch(function () { k.gagalBukti = true; })
        .then(function () { k.memuat = false; sesudah(); });
    }).catch(function (e) { k.memuat = false; delete siapKirim[t.id]; toast(e.message, 'bad'); });
  }

    var label = function (v) { return v >= 1e9 ? String(Math.round(v / 1e8) / 10).replace('.', ',') + 'M' : String(Math.round(v / 1e6)); };

      '"></div><div><label class="lb" for="pjNtpn">NTPN (kalau ada)</label><input id="pjNtpn" class="in" value="' + esc(F.ntpn) + '" autocomplete="off"></div></div>';

  function bacaFormPajak() {
    if (!$('pjMasa')) return;

  function segarkanFormPajak(el) {
    bacaFormPajak();

    if (F.jenis === 'PPN' && !F.nominalManual && (F.ppnKeluaran || F.ppnMasukan) && $('pjNominal')) {
      var n = Math.max(0, angka(F.ppnKeluaran) - angka(F.ppnMasukan));

  // ================= foto
  function inputFoto(id) {
    var f = F.foto;
    return '<input id="' + id + '" type="file" accept="image/*" class="in" data-foto="1">' + (f ? '<div class="foto-prev"><img src="' + f.url +
      '" alt="Foto bukti"><span class="small muted">Foto siap disimpan</span></div>' : '');
  }
  function bacaFoto(el) {
    var file = el.files && el.files[0];
    if (!file) return;
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var maks = 1280, k = Math.min(1, maks / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL('image/jpeg', 0.72);
      F.foto = { b64: data.split(',')[1], mime: 'image/jpeg', url: data };
      URL.revokeObjectURL(url);
      tampilFoto(el);
    };
    img.onerror = function () { toast('Foto tidak bisa dibaca, coba foto lain.', 'bad'); };
    img.src = url;
  }
  function tampilFoto(el) {
    var prev = el.parentNode.querySelector('.foto-prev');
    if (prev) prev.remove();
    var d = document.createElement('div');
    d.className = 'foto-prev';
    d.innerHTML = '<img src="' + F.foto.url + '" alt="Foto bukti"><span class="small muted">Foto siap disimpan</span>';
    el.parentNode.insertBefore(d, el.nextSibling);
  }
  window.__sibagiFoto = function (id, dataUrl) {
    var el = $(id);
    if (!el) return;
    F.foto = { b64: dataUrl.split(',')[1], mime: 'image/jpeg', url: dataUrl };
    tampilFoto(el);
  };

  // ================= sheet
  function bukaSheet(jenis, id, html) {
    sheetAktif = { jenis: jenis, id: id };
    $('sheetIsi').innerHTML = html;
    $('sheet').classList.remove('hidden');
  }
  function tutupSheet() {
    sheetAktif = null;
    $('sheet').classList.add('hidden');

  }
  // ================= dek kartu slip: cek (keuangan) / setujui (penyetuju) satu-satu
  // Mode 'cek': kartu yang sudah "Benar" diingat selama aplikasi terbuka (DICEK), jadi dek yang dibuka ulang lanjut dari kartu berikutnya.
  // Mode 'setuju': keputusan dikumpulkan dulu, baru dikirim sekaligus di akhir (satu panggilan setujui + satu per alasan kembalikan).
  var DEK = null, DICEK = {};
  function bukaDek(mode, ids) {
    var slips = ids.map(slipById).filter(function (s) { return s && s.tahap === (mode === 'setuju' ? 'MENUNGGU' : 'DRAF'); });
    if (!slips.length) return;
    DEK = { mode: mode, ids: slips.map(function (s) { return s.id; }), hasil: {}, alasan: {}, sibuk: false };
    DEK.i = mode === 'cek' ? lanjutDek() : 0;
    tutupSheet();
    $('dek').classList.remove('hidden');
    $('dek').scrollTop = 0;
    SUARA.pop();
    renderDek();
  }
  function lanjutDek() {
    for (var i = 0; i < DEK.ids.length; i++) if (!DICEK[DEK.ids[i]]) return i;
    return DEK.ids.length;
  }
  function tutupDek() {
    DEK = null;
    $('dek').classList.add('hidden');
    $('dekIsi').innerHTML = '';
  }
  function kartuDek(s) {
    var inisial = s.nama.split(/\s+/).map(function (x) { return x.charAt(0); }).join('').slice(0, 2).toUpperCase();
    return '<div class="kartu depan" id="kartuDek" data-id="' + s.id + '" data-nama="' + esc(s.nama) + '"><div class="kartu-kepala"><div class="av">' + esc(inisial) + '</div><div style="min-width:0">' +
      '<div class="nm">' + esc(s.nama) + '</div><div class="small muted">' + (s.jenis === 'SLUDGE-HASIL' ? 'hasil sludge' : s.rit + ' rit · ' + ribu(s.kg) + ' kg') +
      ' · ' + s.id + '</div></div></div><div class="hak"><small>HAK BERSIH</small><b id="dekHak">' + rp(s.hakBersih) + '</b></div>' +
      (s.catatanTolak ? '<div class="note warn small">Dikembalikan: ' + esc(s.catatanTolak) + '</div>' : '') + barisHtml(s.baris) + '</div>';
  }
  function renderDek() {
    var d = DEK, n = d.ids.length, h;
    if (d.i >= n) { selesaiDek(); return; }
    var s = slipById(d.ids[d.i]);
    if (!s) { d.i++; renderDek(); return; }
    var sudah = d.mode === 'cek' ? d.ids.filter(function (id) { return DICEK[id]; }).length : d.i;
    h = '<div class="dek-atas"><div><div class="judul">' + (d.mode === 'setuju' ? esc(sapa(S.akun.nama)) + ', cek slip ini ya' : 'Slip baru, cek dulu ya') + '</div>' +
      '<div class="sub">' + esc(s.namaPabrik) + ' · ' + bulanPendek(s.bulan) + ' · kartu ' + (d.i + 1) + ' dari ' + n + '</div></div>' +
      '<button class="x" data-a="dekTutup" id="dekTutup" aria-label="Tutup">×</button></div>' +
      '<div class="dek-progres"><span style="width:' + Math.round(sudah / n * 100) + '%"></span></div><div class="tumpuk">' +
      (d.i + 2 < n ? '<div class="kartu belakang b2"></div>' : '') + (d.i + 1 < n ? '<div class="kartu belakang b1"></div>' : '') + kartuDek(s) + '</div>';
    h += '<div class="dek-aksi"><div class="dua">' + (d.mode === 'setuju' ?
      '<button class="btn ghost" data-a="dekTolak" id="dekTolak">Kembalikan</button><button class="btn" data-a="dekOke" id="dekOke">Setujui ✓</button>' :
      '<button class="btn ghost" data-a="dekUbah" id="dekUbah">Ubah / potongan</button><button class="btn" data-a="dekOke" id="dekOke">Benar ✓</button>') + '</div></div>';
    $('dekIsi').innerHTML = h;
    hitungNaik($('dekHak'), s.hakBersih);
  }
  function putuskan(hasil) {
    var d = DEK;
    if (!d || d.sibuk) return;
    var id = d.ids[d.i], kartu = $('kartuDek');
    d.sibuk = true;
    if (d.mode === 'cek') DICEK[id] = true; else d.hasil[id] = hasil;
    var cap = d.mode === 'cek' ? ['hijau', '✓ DICEK'] : hasil === 'OK' ? ['ungu', 'DISETUJUI'] : ['merah', 'DIKEMBALIKAN'];
    var c = document.createElement('div');
    c.className = 'cap ' + cap[0];
    c.textContent = cap[1];
    kartu.appendChild(c);
    setTimeout(function () { SUARA.stempel(); getar(25); }, 140);
    setTimeout(function () { kartu.classList.add('keluar'); if (hasil === 'TOLAK') kartu.classList.add('kanan'); }, 560);
    setTimeout(function () { if (DEK !== d) return; d.sibuk = false; d.i++; renderDek(); }, 940);
  }
  function selesaiDek() {
    var d = DEK, ok, tolak, total, h;
    ok = d.ids.filter(function (id) { return d.mode === 'cek' ? DICEK[id] : d.hasil[id] === 'OK'; });
    tolak = d.ids.filter(function (id) { return d.hasil[id] === 'TOLAK'; });
    total = ok.map(slipById).reduce(function (a, s) { return a + s.hakBersih; }, 0);
    h = '<div class="dek-atas"><div></div><button class="x" data-a="dekTutup" id="dekTutup" aria-label="Tutup">×</button></div><div class="selesai-dek">' +
      '<svg class="centang" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="50"/><path d="M32 57l15 15 32-34"/></svg>';
    if (d.mode === 'cek') {
      h += '<h2>Semua ' + ok.length + ' slip sudah dicek</h2><div class="rinci">Total ke pemilik</div><div class="total" id="dekTotal">' + rp(total) + '</div>' +
        '<button class="btn" style="margin-top:18px" data-a="dekAjukan" id="dekAjukan">' + (S.set.wajibSetuju ? 'Ajukan ke ' + esc(nPenyetuju()) : 'Tandai siap transfer') + '</button>' +
        '<button class="btn ghost" style="margin-top:10px;background:transparent;color:#FFE38A;border-color:rgba(255,214,64,.55)" data-a="dekTutup">Nanti dulu</button>';
    } else {
      h += '<h2>' + (ok.length ? ok.length + ' slip disetujui' : 'Belum ada yang disetujui') + '</h2>' + (ok.length ? '<div class="total" id="dekTotal">' + rp(total) + '</div>' : '') +
        (tolak.length ? '<div class="rinci">' + tolak.length + ' slip dikembalikan ke ' + esc(nKeuangan()) + '</div>' : '') +
        '<button class="btn" style="margin-top:18px" data-a="dekKirim" id="dekKirim">Kirim keputusan</button>' +
        '<button class="btn ghost" style="margin-top:10px;background:transparent;color:#FFE38A;border-color:rgba(255,214,64,.55)" data-a="dekUlang">Ulangi dari awal</button>';
    }
    $('dekIsi').innerHTML = h + '</div>';
    SUARA.sukses();
    setTimeout(function () { SUARA.kaching(); }, 380);
    hujanKonfeti(36);

      data.fotoMime = F.foto.mime;
      bukti = { b64: F.foto.b64, mime: F.foto.mime };
    }
    dialog({ judul: 'Simpan transfer?', isi: p.nama + ' · ' + rp(nominal) + '\ndari ' + F.dariRek + ', ' + tglIndo(F.tanggal) + (admin ? '\nadmin ' + rp(admin) : '') +
      (bukti ? '\nfoto bukti ikut disimpan' : ''), ok: 'Simpan' })
      .then(function (ya) {
        if (!ya) return;
        panggil('catatTransfer', data).then(function (r) {
          F = {};
          tabSlip = 'SELESAI';
          buka('slip');
          if (bukti) bukti.nama = 'Bukti transfer ' + r.id + '.jpg';
          siapKirim[r.id] = { teks: r.teks, wa: r.wa, nama: r.nama, bukti: bukti };
          var rg = S.ringkas, beres = !rg.draf.n && !rg.menunggu.n && !rg.siap.n;
          var rayaan = beres ? rayakan('beres', 'Semua slip beres!', 'Transfer ke ' + r.nama + ' ' + rp(nominal) + ' tercatat. Tidak ada lagi yang nunggu.') :
            rayakan('transfer', r.pesan, rp(nominal));
          rayaan.then(function () {
            dialog({ judul: 'Kirim slip' + (bukti ? ' + bukti' : '') + ' ke ' + r.nama + '?', isi: 'Rincian bagi hasil' + (bukti ? ' dan foto bukti transfernya' : '') +
              ' dikirim lewat WhatsApp, supaya ' + r.nama + ' tahu uang ini untuk apa saja.', ok: 'Kirim ke WA', batal: 'Nanti' }).then(function (ok) {
              if (ok) kirimSlipWa(r.id);
            });
          });
        }).catch(function (e) { err.textContent = e.message; });
      });
  };
  function kirimSlipWa(id) {
    var k = siapKirim[id];
    if (!k || !k.teks) return;
    bagikan(k.teks, k.bukti, k.wa, k.nama, function () {
      panggil('tandaiWa', { id: id }, 'Mencatat…').then(function () { render(); if (sheetAktif && sheetAktif.jenis === 'transfer') sheetTransfer(id); })
        .catch(function () {});
    });
  }
  A.kirimSlip = function (id) { kirimSlipWa(id); };
  A.batalTransfer = function (id) {
    dialog({ judul: 'Batalkan transfer ini?', isi: 'Slipnya kembali ke "Siap transfer".', input: 'Alasannya', ok: 'Batalkan', bahaya: true }).then(function (alasan) {
      if (!alasan) return;
      panggil('batalTransfer', { id: id, alasan: alasan }).then(function (r) { tutupSheet(); render(); toast(r.pesan); })
        .catch(function (e) { toast(e.message, 'bad'); });
    });
  };
  A.kirimLaporan = function () { if (F.hasil) bukaWa(waLink_('', F.hasil.teks), 'grup keluarga'); };
  // pabrik & potongan
  A.pabrikBaru = function () {
    F = { jenisForm: 'pabrik', pabrikKode: null, pabrikData: { nama: '', alias: '', namaKontrabon: '', jenis: 'FABA', tarif: null, komisi: null, agen: '', ppn: '', pph: '', cekKomisi: '', aktif: 'YA', catatan: '' } };
    buka('pabrikForm');
  };
  A.pabrikEdit = function (kode) {
    F = { jenisForm: 'pabrik', pabrikKode: kode, pabrikData: JSON.parse(JSON.stringify(pabrikByKode(kode))) };
    buka('pabrikForm');
  };
  A.seg = function (v) {
    var p = v.split('|'), el = $(p[0]);
    Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
    el.setAttribute('data-nilai', p[1]);
    if (p[0] === 'ptArah') {
      F.penerima = $('ptPenerima').value; F.nominal = $('ptNominal').value; F.ket = $('ptKet').value;
      F.arah = p[1];
      F.jenis = (F.arah === 'TAMBAH' ? S.set.jenisTambah : S.set.jenisPotong)[0];
      render();
    }
  };
  function nilaiSeg(id, awal) { var el = $(id); return el.getAttribute('data-nilai') || awal; }
  A.simpanPabrik = function () {
    var p = F.pabrikData;
    var d = { kode: F.pabrikKode, nama: $('pbNama').value, alias: $('pbAlias').value, namaKontrabon: $('pbKontrabon').value, jenis: nilaiSeg('pbJenis', p.jenis), tarif: $('pbTarif').value,
      komisi: $('pbKomisi').value, agen: $('pbAgen').value, ppn: nilaiSeg('pbPpn', p.ppn), pph: nilaiSeg('pbPph', p.pph), cekKomisi: nilaiSeg('pbCek', p.cekKomisi),
      aktif: nilaiSeg('pbAktif', p.aktif || 'YA'), catatan: $('pbCatatan').value };
    panggil('simpanPabrik', d).then(function (r) { F = {}; buka('pabrik'); toast(r.pesan); })
      .catch(function (e) { $('errPabrik').textContent = e.message; });
  };
  A.simpanPotongan = function () {
    var d = { penerima: $('ptPenerima').value, arah: nilaiSeg('ptArah', F.arah), jenis: $('ptJenis').value, nominal: angka($('ptNominal').value), ket: $('ptKet').value };
    if (!d.nominal) { $('errPt').textContent = 'Isi nominalnya.'; return; }
    panggil('tambahPotongan', d).then(function (r) { F = {}; render(); toast(r.pesan); })
      .catch(function (e) { $('errPt').textContent = e.message; });
  };
  A.simpanPin = function () {
    var lama = $('gpLama').value.trim(), baru = $('gpBaru').value.trim(), ulang = $('gpUlang').value.trim();
    if (!lama || !baru) { $('errPin').textContent = 'Isi PIN sekarang dan PIN baru.'; return; }
    if (baru !== ulang) { $('errPin').textContent = 'PIN baru dan ulangannya tidak sama.'; return; }
    panggil('gantiPin', { lama: lama, baru: baru }).then(function (r) {
      SESI = { nama: SESI.nama, pin: baru };
      simpanLokal(KUNCI_SESI, JSON.stringify(SESI));
      buka('lainnya');
      toast(r.pesan);
    }).catch(function (e) { $('errPin').textContent = e.message; });
  };
  A.keluar = function () {
    dialog({ judul: 'Keluar dari SIBAGI?', isi: 'PIN di HP ini dihapus. Nanti masuk lagi pakai nama dan PIN.', ok: 'Keluar' }).then(function (ya) {
      if (!ya) return;
      simpanLokal(KUNCI_SESI, null);
      SESI = null;
      S = null;
      F = {};
      siapKirim = {};
      view = 'beranda';
      tutupSheet();
      $('isi').innerHTML = '';
      $('nav').classList.add('hidden');
      $('chipPeran').classList.add('hidden');
      $('btnMuat').classList.add('hidden');
      tampilMasuk();
    });
  };
  A.resetLatihan = function () {
    dialog({ judul: 'Ulang data latihan?', isi: 'Semua isian latihan dihapus dan kembali ke data contoh awal.', ok: 'Ulang', bahaya: true }).then(function (ya) {
      if (ya && window.SIBAGI_LATIHAN) { window.SIBAGI_LATIHAN.reset(); location.reload(); }
    });
  };

  // dasbor & pajak
  A.dsbTahun = function (v) { F.tahun = Number(v); F.hasil = null; muatDasbor(); };
  A.pajakUbah = function (v) {
    var p;
    if (String(v).indexOf('baru|') === 0) {
      var x = v.split('|');
      p = { masa: Number(x[1]), jenis: x[2] };
    } else {
      var semua = (F.hasil ? F.hasil.pajakTahun.concat(F.hasil.bulanIni.pajak, F.hasil.bulanIni.tunggakan) : []);
      p = semua.filter(function (y) { return y.id === v; })[0];
    }
    mulaiFormPajak(p);
    buka('pajakForm');
  };
  A.simpanPajak = function () {
    bacaFormPajak();
    var err = $('errPajak');
    err.textContent = '';
    if (!/^\d{4}-\d{2}$/.test(F.masa)) { err.textContent = 'Pilih masa pajaknya.'; return; }
    var data = { id: F.id, masa: F.masa, jenis: F.jenis, nominal: F.nominal, tglBayar: F.tglBayar, ntpn: F.ntpn, catatan: F.catatan };
    if (F.jenis === 'PPN') { data.ppnKeluaran = F.ppnKeluaran; data.ppnMasukan = F.ppnMasukan; }
    var nominal = angka(F.nominal);
    dialog({ judul: 'Simpan catatan pajak?', isi: F.jenis + ' masa ' + namaBulan(F.masa) + '\n' + (nominal ? rp(nominal) : 'Nominal dihitung dari PPN keluaran - masukan') + '\n' +
      (F.tglBayar ? 'Dibayar ' + tglIndo(F.tglBayar) : 'Belum dibayar'), ok: 'Simpan' }).then(function (ya) {
      if (!ya) return;
      panggil('simpanPajak', data).then(function (r) { F = {}; buka('dasbor'); toast(r.pesan); })
        .catch(function (e) { err.textContent = e.message; });
    });
  };
  A.batalPajak = function (id) {
    dialog({ judul: 'Batalkan catatan pajak ini?', input: 'Alasannya', ok: 'Batalkan', bahaya: true }).then(function (alasan) {
      if (!alasan) return;
      panggil('batalPajak', { id: id, alasan: alasan }).then(function (r) { F = {}; buka('dasbor'); toast(r.pesan); })
        .catch(function (e) { toast(e.message, 'bad'); });
    });
  };
  A.ceklisBuka = function (no) {
    var c = F.hasil.ceklis.filter(function (x) { return String(x.no) === String(no); })[0];
    if (!c) return;
    F.cek = { no: c.no, status: c.status };
    var opsi = [['BELUM', 'Belum'], ['PROSES', 'Sedang dikerjakan'], ['SELESAI', 'Beres']];
    bukaSheet('ceklis', c.no, '<div class="sheet-top"><div><h2 style="margin:0">' + c.no + '. ' + esc(c.judul) + '</h2><div class="muted small">' + esc(c.uraian) + '</div></div>' +
      '<button class="x" data-a="tutupSheet" aria-label="Tutup">×</button></div><label class="lb">Status</label><div class="seg" id="segCek">' + opsi.map(function (o) {
        return '<button data-a="cekStatus" data-v="' + o[0] + '" class="' + (c.status === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
      }).join('') + '</div><label class="lb" for="cekCatatan">Catatan perkembangan</label><textarea id="cekCatatan" class="in" rows="2">' + esc(c.catatan) + '</textarea>' +
      '<div id="errCek" class="err"></div><button class="btn" data-a="simpanCek" id="btnSimpanCek">Simpan</button>');
  };
  A.cekStatus = function (v) {
    F.cek.status = v;
    Array.prototype.forEach.call(document.querySelectorAll('#segCek button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
  };
  A.simpanCek = function () {
    panggil('ubahCeklis', { no: F.cek.no, status: F.cek.status, catatan: $('cekCatatan').value }).then(function (r) {
      tutupSheet();
      F.hasil = null;
      muatDasbor();
      toast(r.pesan);
    }).catch(function (e) { $('errCek').textContent = e.message; });
  };

  document.addEventListener('click', function (e) {
    SUARA.buka();                               // browser baru mengizinkan suara setelah ada ketukan pertama
    var el = e.target.closest('[data-a]');
    if (!el) return;
    var a = el.getAttribute('data-a');
    if (!A[a]) return;
    if (a !== 'tutupSheetLuar') e.preventDefault();
    A[a](el.getAttribute('data-v'), el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.classList.contains('uang') || el.classList.contains('kg')) formatUang(el);
    if (el.id === 'cariPabrik') { isiDaftarPabrik(el.value); return; }
    if (view === 'tagihanBaru') { bacaFormTagihan(); previewTagihan(); }
    if (view === 'cairForm') { bacaFormCair(); previewCair(); }
    if (view === 'transfer' && el.id === 'tNominal') bacaFormTransfer();
    if (view === 'pajakForm') segarkanFormPajak(el);
    if (view === 'impor') {
      var i = el.getAttribute('data-imp-komisi') || el.getAttribute('data-imp-tarif');
      if (i !== null) {
        var b = F.baris[Number(i)], sebelum = bisaImpor(b);
        if (el.hasAttribute('data-imp-komisi')) b.komisiBaru = el.value; else b.tarifBaru = el.value;
        segarkanKartuImpor(b, sebelum);
      }
    }
  });
  function segarkanKartuImpor(b, sebelum) {
    if (!bisaImpor(b)) b.pilih = false;
    else if (!sebelum) b.pilih = true;
    var kartu = $('imp-' + b.i);
    if (!kartu) return;
    var aktif = document.activeElement && document.activeElement.id;
    var pos = document.activeElement && document.activeElement.selectionStart;
    kartu.outerHTML = kartuImpor(b);
    var tombol = $('btnSimpanImpor');
    var n = F.baris.filter(function (x) { return x.pilih && bisaImpor(x); }).length;
    if (tombol) { tombol.disabled = !n; tombol.textContent = n ? 'Buat ' + n + ' tagihan ' + namaBulan(F.bulan) : 'Belum ada yang dipilih'; }
    if (aktif && $(aktif)) { $(aktif).focus(); try { $(aktif).setSelectionRange(pos, pos); } catch (e) {} }
  }
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-foto')) bacaFoto(el);
    if (el.id === 'filePdf' && el.files && el.files[0]) {
      var file = el.files[0];
      var rd = new FileReader();
      rd.onload = function () { prosesPdf(rd.result, file.name); };
      rd.onerror = function () { toast('File tidak bisa dibaca.', 'bad'); };
      rd.readAsArrayBuffer(file);
    }
    if (view === 'impor' && el.id === 'impBulan') {
      F.bulan = el.value;
      F.baris.forEach(function (x) { x.pilih = bisaImpor(x); });
      render();
    }
    if (view === 'impor' && el.hasAttribute && el.hasAttribute('data-imp-pabrik')) {
      var b = F.baris[Number(el.getAttribute('data-imp-pabrik'))];
      b.pabrik = el.value;
      b.cara = el.value ? 'manual' : '';
      b.gantiPabrik = false;
      b.pilih = bisaImpor(b);
      render();
    }
    if (view === 'tagihanBaru') { bacaFormTagihan(); previewTagihan(); }
    if (view === 'potongan' && el.id === 'ptPenerima') F.penerima = el.value;
    if (view === 'pajakForm' && el.id === 'pjJenis') { bacaFormPajak(); render(); }
    if (view === 'pajakForm' && el.id === 'pjMasa') segarkanFormPajak(el);
  });
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') A.masuk(); });
  $('pin').addEventListener('input', function () { $('pinErr').textContent = ''; });

  // ================= mulai
  function tampilMasuk() {
    $('vMasuk').classList.remove('hidden');
    $('kartuPin').classList.add('hidden');
    $('kartuAkun').classList.remove('hidden');
    $('daftarAkun').innerHTML = new Array(5).join('<div class="akun kerangka"></div>');
    google.script.run.withSuccessHandler(function (d) {
      AKUN = d;
      var warna = { TAGIHAN: '#1D4F7A', KEUANGAN: '#A87400', PENYETUJU: '#8A3B12', ADMIN: '#3F3F46', DIREKSI: '#6B3FA0' };
      var tugas = { TAGIHAN: 'catat tagihan', KEUANGAN: 'uang cair & transfer', PENYETUJU: 'menyetujui', ADMIN: 'admin', DIREKSI: 'lihat ringkasan' };
      $('daftarAkun').innerHTML = d.length ? d.map(function (a) {
        var inisial = a.nama.split(/\s+/).map(function (x) { return x.charAt(0); }).join('').slice(0, 2).toUpperCase();
        return '<button class="akun" data-a="pilihAkun" data-v="' + esc(a.nama) + '" id="akun-' + esc(a.nama.replace(/\s+/g, '')) + '"><div class="av" style="background:' +
          (warna[a.peran] || '#A87400') + '">' + esc(inisial) + '</div><div class="nm">' + esc(a.nama) + '</div><div class="pr">' + esc(tugas[a.peran] || a.namaPeran) + '</div></button>';
      }).join('') : '<div class="kosong">Belum ada akun. Minta A Wira mengisi sheet AKUN.</div>';
    }).withFailureHandler(function (e) {
      $('daftarAkun').innerHTML = '';
      $('akunErr').textContent = pesanError(e);
    }).daftarAkun();
  }
  function masuk(sesi) {
    SESI = sesi;
    $('pinBtn').disabled = true;
    $('pinErr').textContent = '';
    panggil('masuk', {}, 'Memuat…').then(function () {
      simpanLokal(KUNCI_SESI, JSON.stringify(sesi));
      $('vMasuk').classList.add('hidden');
      view = viewAwal();
      render();
      // penyetuju yang punya slip menunggu langsung disambut kartu slip
      if (view === 'setuju' && S.peran === 'PENYETUJU') {
        var ids = S.slip.filter(function (s) { return s.tahap === 'MENUNGGU'; }).map(function (s) { return s.id; });
        if (ids.length) setTimeout(function () { if (view === 'setuju' && !DEK) bukaDek('setuju', ids); }, 500);
      }
    }).catch(function (e) {
      simpanLokal(KUNCI_SESI, null);
      SESI = null;
      $('vMasuk').classList.remove('hidden');
      if (akunDipilih) { A.pilihAkun(akunDipilih); $('pinErr').textContent = e.message; } else { tampilMasuk(); $('akunErr').textContent = e.message; }
    }).then(function () { $('pinBtn').disabled = false; });
  }
  // ================= layar pembuka (tiap aplikasi dibuka; daftar akun dimuat di belakangnya)
  function jalankanPembuka() {
    var el = $('pembuka');
    if (!el) return;
    var buang = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    if (window.SIBAGI_REKAM) { buang(); return; }
    var hemat = false;
    try { hemat = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { hemat = false; }
    if (!hemat) {
      var acak = function (a, b) { return a + Math.random() * (b - a); };
      var lapis = { belakang: '', depan: '' };
      for (var i = 0; i < 30; i++) {
        var koin = i % 3 === 2, depan = i % 4 === 3;
        // lapisan depan (di atas logo) hanya di pinggir supaya tulisan tetap terbaca
        var x = depan ? (i % 8 === 3 ? acak(-8, 5) : acak(88, 97)) : acak(-6, 98);
        lapis[depan ? 'depan' : 'belakang'] += '<div class="uang" style="--x:' + x.toFixed(1) + '%;--dx:' + acak(-40, 40).toFixed(0) +
          'px;--s:' + (depan ? acak(1.05, 1.3) : acak(0.6, 1.05)).toFixed(2) + ';--t:' + (koin ? acak(1.3, 1.8) : acak(1.9, 2.8)).toFixed(2) +
          's;--dl:' + (1.1 + acak(0, 1.5)).toFixed(2) + 's;--g:' + acak(0.45, 0.8).toFixed(2) + 's;--r0:' + acak(-35, -10).toFixed(0) +
          'deg;--r1:' + acak(10, 35).toFixed(0) + 'deg;--k:' + (koin ? acak(0.35, 0.6) : acak(0.7, 1.2)).toFixed(2) + 's"><i>' +
          (koin ? '<span class="koin"></span>' : '<span class="lembar"><b>100</b><b>100</b></span>') + '</i></div>';
      }
      $('pbHujanBelakang').innerHTML = lapis.belakang;
      $('pbHujanDepan').innerHTML = lapis.depan;
    }
    el.classList.add('main');
    var selesai = function () {
      if (el.classList.contains('keluar')) return;
      el.classList.add('keluar');
      setTimeout(buang, 480);
    };
    setTimeout(selesai, hemat ? 900 : 3300);
    el.addEventListener('click', selesai);
  }
  jalankanPembuka();
  if (window.SIBAGI_LATIHAN) window.SIBAGI_LATIHAN.rayakan = rayakan;   // untuk pratinjau & uji layar perayaan
  pasangRiwayat();
  var tersimpan = null;
  try { tersimpan = JSON.parse(bacaLokal(KUNCI_SESI) || 'null'); } catch (e) { tersimpan = null; }
  if (tersimpan && tersimpan.nama) { $('vMasuk').classList.add('hidden'); akunDipilih = tersimpan.nama; masuk(tersimpan); } else tampilMasuk();
})();
</script>
